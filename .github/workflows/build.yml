name: Build and Auto-Tag

on:
  push:
    branches: [ main ]          # можно заменить на вашу основную ветку
  workflow_dispatch:            # ручной запуск

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # необходимо для создания тегов

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # загружаем всю историю, чтобы увидеть все теги

      - name: Calculate next tag
        id: tag
        run: |
          # Найти все теги вида 1.0, 1.1, 1.2, ...
          latest=$(git tag --list '1.*' | sed 's/^1\.//' | sort -n | tail -1)
          if [ -z "$latest" ]; then
            next=0
          else
            next=$((latest + 1))
          fi

          # Защита от коллизий: если такой тег уже существует (например, из параллельного запуска),
          # увеличиваем номер до тех пор, пока не найдём свободный.
          while git rev-parse "1.$next" >/dev/null 2>&1; do
            echo "Tag 1.$next already exists, incrementing..."
            next=$((next + 1))
          done

          echo "next_tag=1.$next" >> $GITHUB_OUTPUT
          echo "✅ Next tag: 1.$next"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Удаляем локальный тег, если он вдруг есть (чтобы избежать конфликта)
          git tag -d ${{ steps.tag.outputs.next_tag }} 2>/dev/null || true

          # Создаём тег
          git tag ${{ steps.tag.outputs.next_tag }}

          # Отправляем в удалённый репозиторий
          git push origin ${{ steps.tag.outputs.next_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ниже вы можете добавить свои шаги сборки, тестирования, создания релиза и т.д.
      # Например:
      # - name: Build executable
      #   run: |
      #     pip install pyinstaller
      #     pyinstaller --onefile your_script.py
