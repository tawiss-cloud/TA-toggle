name: Build EXE and Create Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --noconsole --icon=icon.ico toggle_modes.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TA-toggle-exe
          path: dist/toggle_modes.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built EXE
        uses: actions/download-artifact@v4
        with:
          name: TA-toggle-exe

      - name: Calculate next version
        id: version
        run: |
          # Загружаем все теги из удалённого репозитория
          git fetch --tags --force

          # Находим последний тег, отсортированный по версии (числовой порядок)
          # Игнорируем возможный префикс 'v' и берём только теги с тремя цифрами
          LATEST_TAG=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n -r | head -n1)

          echo "Latest tag found: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            # Если тегов нет, начинаем с 1.0.0
            NEW_TAG="1.0.0"
          else
            # Разбиваем на major.minor.patch
            IFS='.' read -r major minor patch <<< "$LATEST_TAG"
            # Увеличиваем минорную версию, патч обнуляем
            minor=$((minor + 1))
            NEW_TAG="$major.$minor.0"
          fi

          echo "New tag will be: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: toggle_modes.exe
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: "TA-toggle ${{ steps.version.outputs.new_tag }}"
          draft: false
          prerelease: false
