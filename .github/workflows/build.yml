name: Build EXE and Create Release

# Разрешаем запуск вручную из вкладки Actions
on:
  workflow_dispatch:

jobs:
  # Первая задача – собрать .exe на Windows
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller   # <-- явно устанавливаем PyInstaller

    - name: Build EXE
      run: |
        python -m PyInstaller --onefile --noconsole --icon=icon.ico toggle_modes.py

    - name: Upload EXE as artifact (для временного хранения)
      uses: actions/upload-artifact@v4
      with:
        name: TA-toggle-exe
        path: dist/toggle_modes.exe

  # Вторая задача – создать Release и прикрепить к нему .exe
  release:
    needs: build        # Эта задача запустится только после успешной сборки
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Даём разрешение на создание релиза

    steps:
    - name: Download built EXE
      uses: actions/download-artifact@v4
      with:
        name: TA-toggle-exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: toggle_modes.exe          # Файл, который попадёт в релиз
        tag_name: v1.1.0                 # Можно менять вручную или сделать автоматическим
        name: "TA-toggle v1.1.0"
        draft: false
        prerelease: false
