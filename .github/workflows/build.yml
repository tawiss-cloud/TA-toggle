release:
  needs: build
  runs-on: ubuntu-latest
  permissions:
    contents: write

  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download built EXE
      uses: actions/download-artifact@v4
      with:
        name: TA-toggle-exe

    - name: Bump minor version and create tag
      id: tag_version
      uses: anothrNick/github-tag-action@1.67.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: minor   # <-- ключевое изменение: увеличивается минор

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: toggle_modes.exe
        tag_name: ${{ steps.tag_version.outputs.new_tag }}
        name: "TA-toggle ${{ steps.tag_version.outputs.new_tag }}"
        draft: false
        prerelease: false
