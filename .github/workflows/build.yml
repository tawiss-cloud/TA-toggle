name: Build and Auto-Tag

on:
  push:
    branches: [ main ]          # Запуск при пуше в main
  workflow_dispatch:            # Возможность запустить вручную

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # Необходимо для создания тегов

    steps:
      # 1. Загружаем код со всей историей (чтобы получить все теги)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Вычисляем следующий номер тега (1.x)
      - name: Get next tag
        id: tag
        run: |
          # Найти все теги, начинающиеся с "1." (например, 1.0, 1.1, 1.2)
          latest=$(git tag --list '1.*' | sed 's/^1\.//' | sort -n | tail -1)
          if [ -z "$latest" ]; then
            next=0
          else
            next=$((latest + 1))
          fi
          echo "next_tag=1.$next" >> $GITHUB_OUTPUT
          echo "Calculated next tag: 1.$next"

      # 3. Создаём и пушим новый тег
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.next_tag }}
          git push origin ${{ steps.tag.outputs.next_tag }}

      # 4. (Опционально) Здесь можно добавить шаги сборки вашего проекта
      # Например, установка зависимостей, компиляция, создание релиза и т.д.
