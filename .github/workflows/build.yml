name: Build EXE and Create Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --noconsole --icon=icon.ico toggle_modes.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TA-toggle-exe
          path: dist/toggle_modes.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download built EXE
        uses: actions/download-artifact@v4
        with:
          name: TA-toggle-exe

      - name: Calculate next version
        id: version
        run: |
          # Загружаем все теги из удалённого репозитория
          git fetch --tags --force

          # Нормализуем теги: убираем 'v', добавляем .0 если версия из двух чисел (major.minor)
          NORMALIZED=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$' | sed 's/^v//' | while read -r t; do
            if [[ "$t" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "$t.0"
            else
              echo "$t"
            fi
          done)

          # Находим самый свежий тег через числовую сортировку по каждому сегменту
          LATEST_TAG=$(echo "$NORMALIZED" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
          echo "Latest tag found: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            # Если тегов нет, начинаем с 1.0.0
            NEW_TAG="1.0.0"
          else
            # Разбиваем на major.minor.patch
            IFS='.' read -r major minor patch <<< "$LATEST_TAG"
            # Увеличиваем минорную версию, патч обнуляем
            minor=$((minor + 1))
            NEW_TAG="$major.$minor.0"
          fi

          # Защита от коллизий: если вычисленный тег уже существует (локально или на remote),
          # продолжаем увеличивать minor, пока не найдём свободную версию
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1; do
            echo "Tag $NEW_TAG already exists, trying next..."
            IFS='.' read -r major minor patch <<< "$NEW_TAG"
            minor=$((minor + 1))
            NEW_TAG="$major.$minor.0"
          done

          echo "New tag will be: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: toggle_modes.exe
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: "TA-toggle ${{ steps.version.outputs.new_tag }}"
          draft: false
          prerelease: false
