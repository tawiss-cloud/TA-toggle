name: Build EXE and Create Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужно для получения всех тегов

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --noconsole --icon=icon.ico toggle_modes.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TA-toggle-exe
          path: dist/toggle_modes.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built EXE
        uses: actions/download-artifact@v4
        with:
          name: TA-toggle-exe

      - name: Bump minor version and create tag
        id: tag_version
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: minor   # увеличивает вторую цифру (v1.0.0 → v1.1.0)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: toggle_modes.exe
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: "TA-toggle ${{ steps.tag_version.outputs.new_tag }}"
          draft: false
          prerelease: false
