name: Build and Auto-Tag

on:
  push:
    branches: [ main ]          # замените на вашу основную ветку, если нужно
  workflow_dispatch:            # ручной запуск из интерфейса GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # обязательно для создания тегов

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # загружаем всю историю, чтобы получить все теги

      - name: Fetch all tags from remote
        run: git fetch --tags   # подтягиваем свежие теги из удалённого репозитория

      - name: Calculate next tag
        id: tag
        run: |
          # Находим максимальный номер среди тегов вида "1.xxx"
          latest=$(git tag --list '1.*' | sed 's/^1\.//' | sort -n | tail -1)
          if [ -z "$latest" ]; then
            next=0
          else
            next=$((latest + 1))
          fi

          # Проверяем, не существует ли уже тег с таким номером локально
          while git rev-parse "1.$next" >/dev/null 2>&1; do
            echo "Tag 1.$next already exists locally, incrementing..."
            next=$((next + 1))
          done

          # Проверяем, не существует ли такой тег на удалённом репозитории
          while git ls-remote --tags origin "refs/tags/1.$next" | grep -q "1.$next"; do
            echo "Tag 1.$next already exists on remote, incrementing..."
            next=$((next + 1))
          done

          echo "next_tag=1.$next" >> $GITHUB_OUTPUT
          echo "✅ Next tag: 1.$next"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.next_tag }}
          # Явно передаём токен для аутентификации
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ steps.tag.outputs.next_tag }}
