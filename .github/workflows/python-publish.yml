name: Build and Release EXE

on:
  workflow_dispatch:   # Запуск вручную из вкладки Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller   # <-- явно ставим PyInstaller

    - name: Build EXE
      run: |
        # Используем python -m PyInstaller, чтобы гарантировать вызов
        python -m PyInstaller --onefile --noconsole --icon=icon.ico toggle_modes.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TA-toggle-windows-exe
        path: dist/toggle_modes.exe
